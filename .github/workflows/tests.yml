name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Never call paid APIs or write metrics to Azure SQL from CI.
      METRICS_SQL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y unixodbc
          pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes envutil.py paths.py classifier enrichment salesforce scripts
      - name: Unit tests (offline)
        env:
          # Keep imagery / geocode caches out of the checkout. The runner
          # context is only available at step level, not in job-level env.
          SITE_ORCHESTRATOR_DATA: ${{ runner.temp }}/site-orchestrator-data
        run: python -m pytest -q
